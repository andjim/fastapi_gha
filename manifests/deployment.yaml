# kubernetes deployment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dateapi
  labels:
    app: dateapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dateapi
  template:
    metadata:
      labels:
        app: dateapi
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: dateapi
          image: "${TESTING_IMAGE}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /date
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5