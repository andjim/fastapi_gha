name: 99 - Final Image Build with Tests parrallelized

on:
  push:
    branches: [master]
  pull_request:
    # I could also choose which branch PR triggers

jobs:
  build-image:
    name: Build Image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Rust toolchain
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # This action allows to build images using QEMU to emulate other architecture and build images for the chosen architecture
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Docker Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          push: true
          load: true 
          tags: ghcr.io/andjim/docker-ci-automation:${{ github.run_id }}
          target: test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  tests:
    name: Testing Suite
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Tests
        run: |
          export TESTING_IMAGE=ghcr.io/andjim/docker-ci-automation:"$GITHUB_RUN_ID"
          docker docker compose -f docker-compose.test.yml up --exit-code-from test_suite

  vulnerability-scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set Test Image Env Variable
        run: |
          export TESTING_IMAGE=ghcr.io/andjim/docker-ci-automation:"$GITHUB_RUN_ID"

      - name: Run Trivy for HIGH,CRITICAL CVEs and report (blocking)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: $"TESTING_IMAGE"
          format: 'sarif'
          exit-code: '1' 
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true # Ignore unfixed vulnerabilities
          vuln-type: 'os,library' # Scan both OS and library vulnerabilities
          output: trivy-results.sarif # Output file for the results
      
      - name: Upload Trivy scan results to github security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() # Always run this step to upload the results
        with:
          sarif_file: 'trivy-results.sarif'

  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: build-image
    steps:

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup K3d
        uses: AbsaOSS/k3d-action@v2
        with:
          cluster-name: "test-cluster"
          args: >-
            --agents 1
            --no-lb
            --k3s-arg "--no-deploy=traefik,servicelb,metrics-server@server:*"

      - name: Deploy to K3d
        run: |
          kubectl create secret docker-registry regcred \
            --docker-server=https://ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GHCR_TOKEN }}
          export TESTING_IMAGE=ghcr.io/andjim/docker-ci-automation:"$GITHUB_RUN_ID"
          envsubst < manifests/deployment.yaml | kubectl apply -f -
          kubectl rollout status deployment dateapi
          kubectl logs deploy/dateapi
          kubectl exec deploy/dateapi -- curl --fail http://localhost:8000/date
  
  build-final-image:
    name: Final Image Build
    runs-on: ubuntu-latest
    needs: [tests, smoke-test, vulnerability-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Rust toolchain
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      # This action allows to build images using QEMU to emulate other architecture and build images for the chosen architecture
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}
    
      - name: Add Metadata
        id: docker_meta
        uses: docker/metadata-action@v4
        with:
          images: andjim/docker-ci-automation
          tags: |
            type=raw,value=06
            type=raw,value=latest,enable=${{ endsWith(github.ref, github.event.repository.default_branch) }}
            type=ref,event=pr
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Docker Build and Push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64